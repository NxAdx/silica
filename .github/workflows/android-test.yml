name: Code Quality and Typecheck

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    name: TypeScript and Static Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run typecheck

